<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10 💐</title>
<meta name="description" content="Thiệp chúc mừng Ngày Phụ nữ Việt Nam 20/10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #4a0b27;
    --plum: #7a1442;
    --rose: #e8567f;
    --rose-deep: #b32d5c;
    --blush: #ffd9e4;
    --gold: #f1cf8b;
    --paper: #fffaf6;
    --ink: #7a1442;
    --w: 320px;
    --h: 220px;
    --v: 128px; /* độ sâu chữ V của phong bì */
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-io: cubic-bezier(.65, 0, .35, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(1200px 700px at 50% 110%, #a3194f 0%, transparent 60%),
      radial-gradient(900px 600px at 15% -10%, #6b1240 0%, transparent 60%),
      linear-gradient(160deg, var(--wine), #2c0618 100%);
    color: var(--blush);
    -webkit-tap-highlight-color: transparent;
  }

  /* Quầng sáng mờ trôi chậm ở nền */
  .glow {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: .45;
    pointer-events: none; will-change: transform;
  }
  .glow.a { width: 380px; height: 380px; background: #ff5c93; top: -100px; left: -80px; animation: drift 18s var(--ease-io) infinite alternate; }
  .glow.b { width: 420px; height: 420px; background: #c2185b; bottom: -140px; right: -100px; animation: drift 22s var(--ease-io) infinite alternate-reverse; }
  @keyframes drift { to { transform: translate3d(70px, 50px, 0) scale(1.15); } }

  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  /* ---------- Sân khấu ---------- */
  .scene {
    position: relative;
    transition: transform 1.2s var(--ease-out);
    transform: translateY(0) scale(var(--k, 1));
  }
  .scene.is-out { transform: translateY(calc(70px * var(--k, 1))) scale(var(--k, 1)); }

  .envelope {
    position: relative;
    width: var(--w); height: var(--h);
    perspective: 1100px;
    cursor: pointer;
    outline: none;
    animation: float 5s ease-in-out infinite;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.45));
    transition: opacity 1s ease .2s;
  }
  .scene.is-front .envelope { animation-play-state: paused; opacity: .55; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-.6deg); }
    50%      { transform: translateY(-9px) rotate(.6deg); }
  }

  /* 1. Mặt sau */
  .back {
    position: absolute; inset: 0; z-index: 1;
    border-radius: 6px 6px 12px 12px;
    background: linear-gradient(180deg, #a82a55, #8f2048);
  }

  /* 2. Lá thư */
  .letter {
    position: absolute; z-index: 2;
    left: 20px; bottom: 10px;
    width: calc(var(--w) - 40px); height: 200px;
    padding: 18px 22px 14px;
    background:
      radial-gradient(circle at 100% 0, rgba(241,207,139,.25), transparent 40%),
      linear-gradient(180deg, #fffdfb, var(--paper));
    border-radius: 6px;
    color: var(--ink);
    text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    transform: translateY(0) scale(1);
    transform-origin: 50% 100%;
    transition:
      transform 1.1s var(--ease-out),
      box-shadow 1s ease;
    will-change: transform;
  }
  /* Viền chỉ vàng bên trong thư */
  .letter::before {
    content: ""; position: absolute; inset: 7px;
    border: 1px solid rgba(214,169,86,.55); border-radius: 4px; pointer-events: none;
  }
  .scene.is-slide .letter { transform: translateY(-122px); transition-duration: 1s; transition-timing-function: var(--ease-io); }
  .scene.is-front .letter {
    z-index: 10;
    transform: translateY(-168px) scale(1.14);
    box-shadow: 0 30px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.4);
  }

  .letter .flower { font-size: 22px; line-height: 1; }
  .letter h1 {
    margin: 0;
    font: italic 600 25px/1.15 'Playfair Display', Georgia, serif;
    color: var(--plum);
    letter-spacing: .2px;
  }
  .letter p { margin: 0; font-size: 12.8px; line-height: 1.62; color: #6b2a48; }
  .letter .sign { font: italic 600 14px 'Playfair Display', Georgia, serif; color: var(--rose-deep); }

  /* Chữ trong thư hiện lần lượt */
  .reveal { opacity: 0; transform: translateY(10px); filter: blur(3px);
            transition: opacity .8s ease, transform .8s var(--ease-out), filter .8s ease; }
  .scene.is-front .reveal { opacity: 1; transform: none; filter: none; }
  .scene.is-front .reveal:nth-child(1) { transition-delay: .35s; }
  .scene.is-front .reveal:nth-child(2) { transition-delay: .5s; }
  .scene.is-front .reveal:nth-child(3) { transition-delay: .7s; }
  .scene.is-front .reveal:nth-child(4) { transition-delay: .95s; }

  /* 3. Mặt trước (hai bên + đáy) */
  .pocket {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    border-radius: 6px 6px 12px 12px;
    clip-path: polygon(0 0, 50% var(--v), 100% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, #f0638c, var(--rose) 55%, #db4a76);
  }
  .pocket::before, .pocket::after { content: ""; position: absolute; inset: 0; }
  /* nếp gấp trái / phải tối hơn một chút */
  .pocket::before {
    background: linear-gradient(90deg, rgba(120,15,60,.22), transparent 55%, rgba(120,15,60,.22));
    clip-path: polygon(0 0, 50% var(--v), 100% 0, 100% 100%, 0 100%);
  }
  .pocket::after {
    background: linear-gradient(0deg, rgba(255,255,255,.18), transparent 35%);
  }
  /* đường may nổi giữa mặt trước */
  .seam { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .seam line { stroke: rgba(255,255,255,.35); stroke-width: 1.2; }

  /* 4. Nắp phong bì */
  .flap {
    position: absolute; left: 0; top: 0; z-index: 4;
    width: 100%; height: var(--v);
    transform-origin: 50% 0;
    transform: rotateX(0deg);
    transition: transform .85s var(--ease-io), z-index 0s .38s;
    backface-visibility: visible;
  }
  .flap i {
    position: absolute; inset: 0; display: block;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, #ff7aa0, var(--rose) 70%, #d9457a);
    transition: background .3s ease .3s;
  }
  .scene.is-open .flap { transform: rotateX(180deg); z-index: 1; }
  .scene.is-open .flap i { background: linear-gradient(0deg, #8f2048, #a82a55); }

  /* Dấu niêm phong */
  .seal {
    position: absolute; z-index: 6;
    left: 50%; top: calc(var(--v) - 24px);
    width: 48px; height: 48px; margin-left: -24px;
    border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffe9b0, var(--gold) 45%, #c9954a 100%);
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 -3px 6px rgba(120,70,10,.35);
    display: grid; place-items: center; font-size: 22px;
    transition: transform .55s var(--ease-out), opacity .4s ease;
    animation: beat 1.8s ease-in-out infinite;
  }
  .seal:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  .scene.is-open .seal { transform: scale(2.2) rotate(25deg); opacity: 0; pointer-events: none; animation: none; }

  /* Gợi ý + nút xem lại */
  .hint, .again {
    position: absolute; left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: 14px; letter-spacing: .2px;
  }
  .hint { top: calc(var(--h) + 40px); color: var(--blush); opacity: .9; transition: opacity .4s ease; animation: nudge 2s ease-in-out infinite; }
  .scene.is-open .hint { opacity: 0; animation: none; }
  @keyframes nudge { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 5px); } }

  .again {
    top: calc(var(--h) + 70px);
    padding: 10px 22px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35);
    font: inherit; font-size: 13.5px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .6s ease, background .2s ease;
  }
  .again.show { opacity: 1; pointer-events: auto; }
  .again:hover { background: rgba(255,255,255,.22); }
  .again:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="scene" id="scene">
    <div class="envelope" id="envelope" role="group" aria-label="Phong bì thư chúc mừng 20/10">
      <div class="back"></div>

      <!-- ✏️ SỬA NỘI DUNG THƯ Ở ĐÂY -->
      <article class="letter">
        <div class="flower reveal">💐</div>
        <h1 class="reveal">Chúc mừng 20/10</h1>
        <p class="reveal">Chúc những người phụ nữ tuyệt vời luôn xinh đẹp, tự tin và ngập tràn hạnh phúc. Cảm ơn vì đã luôn tỏa sáng theo cách riêng của mình.</p>
        <div class="sign reveal">Với tất cả yêu thương ♥</div>
      </article>

      <div class="pocket"></div>
      <svg class="seam" viewBox="0 0 320 220" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="0" x2="160" y2="128"/><line x1="320" y1="0" x2="160" y2="128"/>
      </svg>
      <div class="flap"><i></i></div>
      <button class="seal" id="seal" aria-label="Mở thư">❤️</button>
    </div>

    <div class="hint">Chạm vào dấu niêm phong để mở thư</div>
    <button class="again" id="again">Xem lại</button>
  </main>

<script>
(() => {
  const scene = document.getElementById('scene');
  const seal = document.getElementById('seal');
  const envelope = document.getElementById('envelope');
  const again = document.getElementById('again');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false, opened = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, reduce ? 0 : ms));

  /* Co giãn vừa màn hình điện thoại */
  const fit = () => {
    const k = Math.min(1, (innerWidth - 32) / 360, (innerHeight - 40) / 640);
    scene.style.setProperty('--k', Math.max(.6, k));
  };
  fit(); addEventListener('resize', fit);

  /* Chuỗi hiệu ứng mở thư */
  function open() {
    if (busy || opened) return;
    busy = opened = true;
    scene.classList.add('is-open');                  // 1. mở nắp
    later(() => scene.classList.add('is-slide'), 650);   // 2. thư trượt lên
    later(() => { scene.classList.add('is-out', 'is-front'); burst(); }, 1500); // 3. thư bay ra trước + pháo hoa
    later(() => { again.classList.add('show'); busy = false; }, 3200);
  }
  function reset() {
    if (busy) return;
    timers.forEach(clearTimeout); timers = [];
    scene.classList.remove('is-open', 'is-slide', 'is-out', 'is-front');
    again.classList.remove('show');
    opened = false;
  }
  seal.addEventListener('click', e => { e.stopPropagation(); open(); });
  envelope.addEventListener('click', open);
  again.addEventListener('click', reset);

  /* ---------- Cánh hoa & ánh sáng (canvas) ---------- */
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let W, H, dpr;
  const size = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  size(); addEventListener('resize', size);

  const pinks = ['#ffb3c8', '#ff8fb0', '#ff6b98', '#ffd1df', '#f7a8c4'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const parts = [];

  function petal(x, y, burst) {
    const a = rand(0, Math.PI * 2), s = burst ? rand(4, 14) : 0;
    return {
      x, y,
      vx: burst ? Math.cos(a) * s : rand(-.3, .3),
      vy: burst ? Math.sin(a) * s - 6 : rand(.5, 1.3),
      size: rand(7, burst ? 15 : 12),
      rot: rand(0, 6.28), vr: rand(-.05, .05),
      sway: rand(0, 6.28), swaySpd: rand(.01, .03),
      color: pinks[(Math.random() * pinks.length) | 0],
      spark: burst && Math.random() < .3,
      life: burst ? rand(180, 300) : Infinity,
      age: 0, burst, alpha: burst ? 1 : rand(.35, .75)
    };
  }
  const ambient = reduce ? 0 : (innerWidth < 600 ? 14 : 26);
  for (let i = 0; i < ambient; i++) parts.push(petal(rand(0, W), rand(-H, H), false));

  function burst() {
    if (reduce) return;
    const r = envelope.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2 - 70;
    for (let i = 0; i < 80; i++) parts.push(petal(cx, cy, true));
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.alpha);
    if (p.spark) {                       // tia lấp lánh vàng
      ctx.fillStyle = '#ffe9b0';
      const s = p.size * .5;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0);
      ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0);
      ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
    } else {                             // cánh hoa
      const s = p.size;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo(s * .9, -s * .6, s * .8, s * .6, 0, s);
      ctx.bezierCurveTo(-s * .8, s * .6, -s * .9, -s * .6, 0, -s);
      ctx.fill();
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.sway += p.swaySpd * dt;
      if (p.burst) {                      // nổ ra rồi rơi dần
        p.vx *= Math.pow(.972, dt); p.vy = p.vy * Math.pow(.972, dt) + .12 * dt;
        p.age += dt;
        if (p.age > p.life * .6) p.alpha -= .012 * dt;
        if (p.age > p.life || p.alpha <= 0 || p.y > H + 30) { parts.splice(i, 1); continue; }
      }
      p.x += (p.vx + Math.sin(p.sway) * .6) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (!p.burst && p.y > H + 20) { p.y = -20; p.x = rand(0, W); }
      drawPetal(p);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
